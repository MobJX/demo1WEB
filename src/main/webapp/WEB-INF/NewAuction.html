<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Auction Created Successfully</title>
</head>
<body>
	<h1>Auction ID <span th:text = "${auction.aucID}"></span> Created Successfully</h1>
	<h2>Owner ID: <span th:text = "${auction.ownerID}"></span></h2>
	<h2>Starting Price: <span th:text = ${auction.aucPrice}></span></h2>

<a th:href="@{/Home}">Back to home</a>
