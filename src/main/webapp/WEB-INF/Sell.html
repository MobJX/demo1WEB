<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Selling Page</title>
</head>
<h1>Let's SELL SELL SELL !!!</h1>
<body>

<!-- View auction created by user -->
<!-- List of auction item not closed -->
<!-- List of auction item closed -->

<ul>
        <li><a href = "CreateNewItem">Create a new item</a></li>
        <li><a href = "CreateNewAuction">Create a new auction item</a></li>
</ul>

<p><b>Open Auctions </b></p>
	<div>
		<table border='1'>
			<thead>
				<tr>
				<th>Auction ID</th><th>User ID</th><th>Auction Price</th><th>minUP</th><th>ExpiryDayTime</th>
 				</tr>
 				</thead>
				<tbody>
				<tr th:each="on : ${aucON}">
					<td th:text="${on.aucID}"></td>
					<td th:text="${on.aucPrice}"></td>
					<td th:text="${on.minUP}"></td>
					<td th:text="${on.expiryDateTime}"></td>
					<td><a th:href="@{/GetAuctionItemDetails(aucID=${m.aucID})}">Details</a></td>
				</tr>
			</tbody>
		</table>
	</div>  


<p><b>Closed Auctions </b></p>
	<div>
		<table border='1'>
			<thead>
				<tr>
				<th>Auction ID</th><th>Auction Price</th><th>minUP</th><th>ExpiryDayTime</th>
 				</tr>
 				</thead>
				<tbody>
				<tr th:each="off : ${aucOFF}">
					<td th:text="${off.ownerID}"></td>
					<td th:text="${off.aucPrice}"></td>
					<td th:text="${off.minUP}"></td>
					<td th:text="${off.expiryDateTime}"></td>
					<td><a th:href="@{/GetAuctionItemDetails(aucID=${m.aucID})}">Details</a></td>
				</tr>
			</tbody>
		</table>
	</div>  
	
	
</body>
</html>
