<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Added successfully!</title>
</head>
<body>
	
<!-- Show item details of this Auction -->
<table>
  <thead>
    <tr>
      <th>Item ID</th>
      <th>Item Name</th>
      <th>Item Description</th>
      <th>Item Image</th>
      <th>Starting Price</th>
    </tr>
  </thead>
  <tbody>
	<tr th:each="item : ${items}">
		<td th:text="${item.itemID}"></td>
		<td th:text="${item.itemName}"></td>
		<td th:text="${item.description}"></td>
		<td><img th:src="${item.imagePath}" width="200" height="150"></td>
		<td th:text="${item.itemPrice}"></td>
    </tr>
    </tbody>
</table>
<br>
<a th:href="@{/CreateNewItem}">Return</a>
	
</body>
</html>
